spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/finance_dev
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

    hikari:
      connection-timeout: 30000
      initialization-fail-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

