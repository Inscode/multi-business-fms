name: Deploy Backend to Production

# Trigger: every push to dev branch
on:
  push:
    branches: [dev]
    paths:
      # Only run when backend code actually changed — skip if only frontend was touched
      - 'backend/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Build ─────────────────────────────────────────────────────────────
      #
      # WHY cache: Maven downloads ~50MB of dependencies on every run without it.
      # With cache, subsequent deploys take ~30s instead of ~2 minutes.
      #
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR (skip tests for faster deploy)
        working-directory: backend
        run: mvn package -DskipTests

      # ── 3. Set up SSH ────────────────────────────────────────────────────────
      #
      # WHY ssh-keyscan: GitHub Actions runner doesn't know your server yet.
      # This adds the server's fingerprint to known_hosts so SSH doesn't
      # prompt "are you sure you want to connect?" and hang the pipeline.
      #
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 139.162.39.68 >> ~/.ssh/known_hosts

      # ── 4. Stop the service ──────────────────────────────────────────────────
      #
      # Must stop BEFORE copying the jar — JVM locks the file on Linux while running.
      # We use || true so the step doesn't fail if the service was already stopped.
      #
      - name: Stop finance service on server
        run: ssh deploy@139.162.39.68 "sudo systemctl stop finance || true"

      # ── 5. Deploy the JAR ────────────────────────────────────────────────────
      - name: Copy JAR to server
        run: |
          scp backend/target/finance-0.0.1-SNAPSHOT.jar \
            deploy@139.162.39.68:/opt/finance/app.jar

      # ── 6. Restart the service ───────────────────────────────────────────────
      - name: Start finance service on server
        run: ssh deploy@139.162.39.68 "sudo systemctl start finance"

      # ── 7. Health check ──────────────────────────────────────────────────────
      #
      # Port 8080 is not exposed publicly so we check via SSH instead.
      # Verifies the service is active AND Spring Boot finished starting.
      # If it crashed (bad migration, missing env var), logs are printed here.
      #
      - name: Wait for app to start
        run: sleep 25

      - name: Health check
        run: |
          ssh deploy@139.162.39.68 "
            if ! systemctl is-active --quiet finance; then
              echo 'Service is not running!'
              sudo journalctl -u finance -n 50 --no-pager
              exit 1
            fi
            if ! sudo journalctl -u finance -n 100 --no-pager | grep -q 'Started FinanceApplication'; then
              echo 'Spring Boot did not finish starting!'
              sudo journalctl -u finance -n 80 --no-pager
              exit 1
            fi
            echo 'Deploy successful — service is running and Spring Boot started.'
          "
