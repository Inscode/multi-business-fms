<mat-sidenav-container class="app-shell">
  <mat-sidenav
    #sidenav
    [mode]="isMobile ? 'over' : 'side'"
    [opened]="!isMobile"
    class="app-sidenav"
  >
    <div class="brand">
      <div class="brand-icon">
        <mat-icon>account_balance</mat-icon>
      </div>
      <div class="brand-text" *ngIf="!collapsed">
        <span class="brand-name">Finance MS</span>
        <span class="brand-sub">Multi-Business</span>
      </div>
    </div>

    <nav class="nav-list">
      <a class="nav-item" routerLink="/dashboard" routerLinkActive="active" matRipple>
        <mat-icon>dashboard</mat-icon>
        <span *ngIf="!collapsed">Dashboard</span>
      </a>
      <a class="nav-item" routerLink="/bills" routerLinkActive="active" matRipple *ngIf="showBills">
        <mat-icon>receipt_long</mat-icon>
        <span *ngIf="!collapsed">Bills</span>
      </a>

      <a
        class="nav-item"
        routerLink="/payments"
        routerLinkActive="active"
        matRipple
        *ngIf="showBills"
      >
        <mat-icon>payments</mat-icon>
        <span *ngIf="!collapsed">Payments</span>
      </a>

      <a class="nav-item" routerLink="/staff" routerLinkActive="active" matRipple *ngIf="showStaff">
        <mat-icon>badge</mat-icon>
        <span *ngIf="!collapsed">Staff</span>
      </a>
    </nav>

    <div class="nav-footer" *ngIf="!collapsed">
      <span class="version-label">v1.0 · MVP</span>
    </div>
  </mat-sidenav>

  <mat-sidenav-content class="main-content">
    <app-navbar (toggleSidenav)="sidenav.toggle()" (toggleCollapse)="toggleCollapse()"></app-navbar>

    <div class="page-body">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
