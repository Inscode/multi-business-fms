<div class="page">
  <div class="page-header">
    <div class="header-left">
      <h1 class="page-title">Customers</h1>
      <p class="page-sub">{{ customers.length }} total</p>
    </div>
    <button mat-raised-button color="primary" (click)="openAdd()">
      <mat-icon>add</mat-icon> Add Customer
    </button>
  </div>

  <!-- Inline Form -->
  <div class="form-card" *ngIf="showForm">
    <h3 class="form-title">{{ editingId ? 'Edit Customer' : 'New Customer' }}</h3>
    <form [formGroup]="form" (ngSubmit)="save()" class="form-row">
      <mat-form-field appearance="outline" class="field-full">
        <mat-label>Customer Name</mat-label>
        <input matInput formControlName="name" placeholder="e.g. FANCY HOUSE" />
        <mat-error *ngIf="form.get('name')?.hasError('required')">Required</mat-error>
        <mat-error *ngIf="form.get('name')?.hasError('minlength')">Min 2 characters</mat-error>
      </mat-form-field>
      <div class="form-actions">
        <button mat-button type="button" (click)="cancelForm()">Cancel</button>
        <button mat-raised-button color="primary" type="submit" [disabled]="saving">
          <mat-spinner diameter="16" *ngIf="saving"></mat-spinner>
          <span *ngIf="!saving">{{ editingId ? 'Update' : 'Save' }}</span>
        </button>
      </div>
      <p class="error-msg" *ngIf="errorMsg">{{ errorMsg }}</p>
    </form>
  </div>

  <!-- Search -->
  <div class="search-bar">
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Search</mat-label>
      <mat-icon matPrefix>search</mat-icon>
      <input matInput (input)="onSearch($event)" placeholder="Filter by name..." />
    </mat-form-field>
  </div>

  <!-- Loading -->
  <div class="loading-wrap" *ngIf="loading">
    <mat-spinner diameter="36"></mat-spinner>
  </div>

  <!-- Table -->
  <div class="table-wrap" *ngIf="!loading">
    <table mat-table [dataSource]="filtered" class="customers-table">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let c">{{ c.name }}</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let c">
          <span class="badge" [class.active]="c.active" [class.inactive]="!c.active">
            {{ c.active ? 'Active' : 'Inactive' }}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let c" class="actions-cell">
          <button mat-icon-button (click)="openEdit(c)" matTooltip="Edit">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button (click)="toggleActive(c)" [matTooltip]="c.active ? 'Deactivate' : 'Activate'">
            <mat-icon>{{ c.active ? 'toggle_on' : 'toggle_off' }}</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="remove(c)" *ngIf="canDelete" matTooltip="Delete">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;" [class.inactive-row]="!row.active"></tr>
    </table>

    <div class="empty-state" *ngIf="filtered.length === 0">
      <mat-icon>people_outline</mat-icon>
      <p>No customers found</p>
    </div>
  </div>
</div>
