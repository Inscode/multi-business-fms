<div class="page">
  <div class="page-header">
    <button mat-icon-button routerLink="/expenses">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <div>
      <h1 class="page-title">Add Expense</h1>
      <p class="page-sub">Record a business expense</p>
    </div>
  </div>

  <div class="form-card" [formGroup]="form">
    <div class="form-row">
      <mat-form-field appearance="outline">
        <mat-label>Business</mat-label>
        <mat-select formControlName="business">
          <mat-option *ngFor="let b of businesses" [value]="b">{{ b }}</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Date</mat-label>
        <input matInput [matDatepicker]="picker" formControlName="date">
        <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
      </mat-form-field>
    </div>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Category</mat-label>
      <mat-select formControlName="category">
        <mat-option *ngFor="let c of categories" [value]="c.value">
          {{ c.label }}
          <span class="cat-hint"> — {{ c.hint }}</span>
        </mat-option>
      </mat-select>
    </mat-form-field>

    <div class="review-warning" *ngIf="needsReview">
      <mat-icon>info</mat-icon>
      This category will be flagged for owner review.
    </div>

    <div class="form-row">
      <mat-form-field appearance="outline">
        <mat-label>Amount</mat-label>
        <input matInput type="number" formControlName="amount" min="1" placeholder="0.00">
        <span matPrefix>Rs&nbsp;</span>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Worker (optional)</mat-label>
        <mat-select formControlName="workerId">
          <mat-option [value]="null">None</mat-option>
          <mat-option *ngFor="let w of workers" [value]="w.id">
            {{ w.fullName }} · {{ w.workerType }}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Description / Reason (optional)</mat-label>
      <textarea matInput formControlName="description" rows="3"
                placeholder="e.g. Fuel for morning delivery route, Tea for 3 workers..."></textarea>
    </mat-form-field>

    <div class="error-msg" *ngIf="errorMsg">{{ errorMsg }}</div>

    <div class="form-actions">
      <button mat-stroked-button routerLink="/expenses">Cancel</button>
      <button mat-flat-button color="primary"
              [disabled]="form.invalid || submitting"
              (click)="submit()">
        <mat-spinner diameter="18" *ngIf="submitting"></mat-spinner>
        <span *ngIf="!submitting">Save Expense</span>
      </button>
    </div>
  </div>
</div>
